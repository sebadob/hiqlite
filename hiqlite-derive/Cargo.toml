[package]
name = "hiqlite-derive"
version = "0.17.0-20261117"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version = "1.95"
categories = ["database", "caching"]
keywords = ["database", "sql", "sqlite", "raft", "cache"]
description = "Macros for Hiqlite"
repository = "https://github.com/sebadob/hiqlite"

[lib]
proc-macro = true

[lints]
workspace = true

[features]
# Compiles the vendored SQLite into the macro so `sql!` can prepare a query at compile time.
# `hiqlite` enables this through its `sqlite` feature via a weak dep feature, so code that only
# uses the derives never builds it.
sql-check = ["dep:hex", "dep:rusqlite", "dep:sha2"]
sql-check-release = ["sql-check"]

[dependencies]
proc-macro2 = { version = "1.0.90", features = [] }
# `full` + `parsing` so the shape derive can parse its own generated `impl` and attach the `cfg`
# gate to it. `derive` is in `default`, which the `sql-check` features of the library turn on; a
# consumer that builds `hiqlite-derive` bare (a `macros` dependency with `default-features = false`)
# must opt into `derive` itself, or the derives do not compile.
syn = { version = "3", features = ["full", "parsing"] }
quote = "1.0.30"
hex = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
