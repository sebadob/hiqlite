name: Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE: allow
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  TERM: xterm

jobs:
  lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/sebadob/rauthy-builder:20261123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Code format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy
      - name: Clippy (feature matrix)
        run: just clippy

  examples:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Clippy (examples)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/sebadob/rauthy-builder:20261123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Share the target directory across examples
        run: printf 'CARGO_TARGET_DIR=%s/target\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Clippy examples
        run: just clippy-examples

  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: ghcr.io/sebadob/rauthy-builder:20261123
            continue-on-error: false
          - os: macos-latest
            container: ''
            continue-on-error: false
          # Advisory until Windows is proven; flip to false when green.
          - os: windows-latest
            container: ''
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (non-Linux)
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Test the Linux workspace without S3
        if: runner.os == 'Linux'
        run: just test-no-s3
      - name: Test hiqlite lib and bins (macOS and Windows)
        if: runner.os != 'Linux'
        env:
          TEST_SKIP_S3_RESTORE: "true"
        run: cargo test -p hiqlite --features cache,counters,dashboard,dlock,listen_notify,macros,toml --lib --bins
      - name: Test hiqlite-wal and hiqlite-derive (macOS and Windows)
        if: runner.os != 'Linux'
        run: cargo test -p hiqlite-wal -p hiqlite-derive

  cluster:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    name: Cluster integration
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Cluster tests
        # Time out the test before the runner can cancel the entire job.
        timeout-minutes: 15
        env:
          TEST_SKIP_S3_RESTORE: "true"
          HQL_DISABLE_COLD_RESTART_GUARD: "true"
        run: cargo test --features cache,counters,dlock,listen_notify,macros,toml --test cluster

  check:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    name: Check
    needs: [lint, examples, test]
    runs-on: ubuntu-latest
    steps:
      - name: Report required checks
        env:
          LINT: ${{ needs.lint.result }}
          EXAMPLES: ${{ needs.examples.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          printf 'lint=%s examples=%s tests=%s\n' "$LINT" "$EXAMPLES" "$TESTS"
          test "$LINT" = success && test "$EXAMPLES" = success && test "$TESTS" = success
