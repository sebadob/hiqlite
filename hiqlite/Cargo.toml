[package]
name = "hiqlite"
version = "0.17.0-20261117"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version = "1.95.0"
categories = ["database", "caching"]
keywords = ["database", "sql", "sqlite", "raft", "cache"]
description = "Hiqlite - highly-available, embeddable, raft-based SQLite + cache"
readme = "../README.md"
repository = "https://github.com/sebadob/hiqlite"

[lib]
# Doc examples are illustrations of calls against a running node, not tests: they need migrations, a
# live client and a `params!()` of the right types to compile.  Doctests are off globally, so
# nothing builds them and they can never fail a build.
doctest = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = false
features = ["full", "external-state-machine"]

# `sql!()` needs the sqlite engine and the derive crate to exist at all.
[[test]]
name = "sql_macro"
required-features = ["sqlite", "macros"]

[[bench]]
name = "bincode"
path = "benches/bincode.rs"
harness = false

[[bench]]
name = "row_access"
path = "benches/row_access.rs"
harness = false
required-features = ["sqlite"]

# `conn_pool` compares today's `deadpool` read pool against the read actors that replace it.
[[bench]]
name = "conn_pool"
path = "benches/conn_pool.rs"
harness = false
required-features = ["sqlite"]

[features]
default = ["auto-heal", "aws_lc_rs", "backup", "sqlite", "toml"]

# The rustls crypto backend. Exactly one of `ring` / `aws_lc_rs` must be selected whenever TLS is
# compiled in, and `aws_lc_rs` is the default. `fips` is the aws-lc-rs FIPS build and implies
# `aws_lc_rs`. Each forwards the backend to every TLS dependency so the unselected provider is never
# compiled in.
#
# `aws_lc_rs` also prefers the post-quantum hybrid group X25519MLKEM768. rustls'
# `prefer-post-quantum` implies `aws_lc_rs`, so it can only ever be enabled from inside this
# feature - on the workspace `rustls` line it would compile aws-lc-rs into a `ring` build.
# `ring` has no post-quantum group at all, so a `ring` build negotiates X25519. `fips` keeps the
# preference: rustls treats ML-KEM as FIPS-compliant when aws-lc is in FIPS mode.
aws_lc_rs = [
  "cryptr?/aws_lc_rs",
  "rcgen/aws_lc_rs",
  "rustls/aws_lc_rs",
  "rustls/prefer-post-quantum",
  "tokio-rustls/aws_lc_rs",
]
ring = [
  "cryptr?/ring",
  "rcgen/ring",
  "rustls/ring",
  "tokio-rustls/ring",
]
fips = [
  "aws_lc_rs",
  "rcgen/fips",
  "rustls/fips",
  "tokio-rustls/fips",
]

auto-heal = ["hiqlite-wal/auto-heal"]
# Opt-in: a single Raft entry larger than `wal_size` fails its write with an error instead of
# panicking the WAL writer.
oversized-entry-error = ["hiqlite-wal/oversized-entry-error"]
# Local backups: the cron job, the local backup dir + its cleanup, and restore from a local
# file. S3 storage for backups is opt-in via the `s3` feature on top of this.
backup = ["dep:cron", "sqlite"]
cache = ["__cluster", "dep:rust_decimal"]
counters = ["cache"]
dashboard = [
  "dep:argon2",
  "dep:axum-extra",
  "dep:cryptr",
  "dep:mime_guess",
  "dep:spow",
  "dep:tower",
  "dep:tower-http",
  "sqlite",
]
dlock = ["cache"]
cast_ints = []
cast_ints_unchecked = []
config-embed = []
# Opt-in state-machine engine for applications that already own consensus.
# This reuses the SQLite connection, read-pool, restore, and single-writer
# machinery without starting a Hiqlite Raft group.
external-state-machine = [
  "dep:rusqlite",
  "rusqlite/backup",
  "rusqlite/functions",
  "rusqlite/hooks",
  "tokio/time",
]
full = [
  "auto-heal",
  "aws_lc_rs",
  "backup",
  "cache",
  "counters",
  "dashboard",
  "dlock",
  "listen_notify",
  "macros",
  "s3",
  "shutdown-handle",
  "sqlite",
  "toml",
]
# Opt-in: keep Cache Snapshots in-memory instead of on disk. This lets a pure
# cache-only node run without a `data_dir`, but doubles snapshot memory cost and
# disables zero-copy snapshot streaming from file. Deliberately NOT part of `full`.
in-memory-snapshots = ["cache"]
jemalloc = ["dep:tikv-jemallocator"]
listen_notify = ["dep:futures-util", "cache"]
macros = ["dep:hiqlite-derive", "dep:rust-embed"]
toml = ["dep:toml"]
# S3 access for backups. Enables cryptr's S3 streaming, and with it `s3-simple`.
# Pushes the `backup` feature's local backups offsite, encrypted.
s3 = ["backup", "cryptr/s3"]
server = [
  "dep:clap",
  "dep:home",
  "dep:tracing-subscriber",
  "config-embed",
  "full",
  "listen_notify",
  "tokio/macros",
]
shutdown-handle = ["dep:ctrlc"]
# Opt-in: run the compile-time checks of `sql!()`, `sql_map!()` and `sql_batch!()` in release
# builds as well. Debug builds always check; without this a release build is untouched by them.
sql-check-release = [
  "macros",
  "sqlite",
  "hiqlite-derive/sql-check-release",
]
sqlite = [
  "__cluster",
  "dep:hex",
  "dep:rusqlite",
  "dep:rust-embed",
  "dep:serde_rusqlite",
  "hiqlite-derive?/sql-check",
  "rusqlite/backup",
  "rusqlite/cache",
  "rusqlite/chrono",
  "rusqlite/column_decltype",
  "rusqlite/csvtab",
  "rusqlite/functions",
  "rusqlite/load_extension",
  "rusqlite/modern_sqlite",
  "rusqlite/serde_json",
  "rusqlite/series",
  "rusqlite/url",
  "rusqlite/uuid",
  "rusqlite/vtab",
]
webpki-roots = ["dep:webpki-root-certs"]

# Internal dependency boundary for the regular Hiqlite Raft/network runtime.
# The external state-machine feature deliberately does not enable it.
__cluster = [
  "dep:axum",
  "dep:phf",
  "dep:axum-server",
  "dep:bincode-next",
  "dep:bytes",
  "dep:chrono",
  "dep:constant_time_eq",
  "dep:crossbeam",
  "dep:dotenvy",
  "dep:fastwebsockets",
  "dep:futures-util",
  "dep:getrandom",
  "dep:hiqlite-wal",
  "dep:hostname",
  "dep:http-body-util",
  "dep:hyper",
  "dep:hyper-util",
  "dep:openraft",
  "dep:rcgen",
  "dep:reqwest",
  "dep:rustc-hash",
  "dep:rustls",
  "dep:rustls-platform-verifier",
  "dep:serde_json",
  "dep:socket2",
  "dep:time",
  "dep:tokio-rustls",
  "dep:url",
]

# Internal use only
__profiling = ["dep:console-subscriber"]

[dependencies]
#hiqlite-derive = { version = "0.15.1", optional = true }
hiqlite-derive = { path = "../hiqlite-derive", optional = true }
#hiqlite-wal = { version = "0.15.1", optional = true }
hiqlite-wal = { path = "../hiqlite-wal", optional = true }

argon2 = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
axum-extra = { workspace = true, optional = true }
axum-server = { workspace = true, optional = true }
bincode-next = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
console-subscriber = { workspace = true, optional = true }
constant_time_eq = { workspace = true, optional = true }
cron = { workspace = true, optional = true }
crossbeam = { workspace = true, optional = true }
cryptr = { workspace = true, optional = true, default-features = false }
ctrlc = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
fastwebsockets = { workspace = true, optional = true }
flume.workspace = true
futures-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hostname = { workspace = true, optional = true }
home = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
openraft = { workspace = true, optional = true }
phf = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
serde_rusqlite = { workspace = true, optional = true }
sha2.workspace = true
spow = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }
thiserror.workspace = true
thread-priority.workspace = true
time = { workspace = true, optional = true }
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid.workspace = true
# reqwest 0.13 requires the full certs to make them useable
webpki-root-certs = { workspace = true, optional = true }

# make minimal versions happy
rust_decimal = { workspace = true, optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[dev-dependencies]
bincode.workspace = true
# `phf_map!` for the hand-written `CacheVariants` impls of the unit tests
phf = { workspace = true, features = ["macros"] }
# the `conn_pool` bench keeps today's `deadpool` read pool as its baseline
deadpool = { workspace = true, features = ["rt_tokio_1"] }
# the `conn_pool` bench compares against a `crossbeam` channel, which is not a regular dependency
crossbeam.workspace = true
criterion.workspace = true
# the `conn_pool` bench reads this process's resident size and raises its open-file limit
libc.workspace = true
tokio = { workspace = true, features = ["full", "test-util", "tracing"] }
tokio-test = "0.4.4"
tracing-subscriber.workspace = true
